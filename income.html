  <meta charset="UTF-8">

  <link rel="stylesheet" href="styles/income.css">
  <link rel="stylesheet" href="styles/add_transaction.css">
  
</head>

<body>
  
  <nav class="menu-bar">
  
  <h3 class="logo">
    Finance tracker
  </h3>
  <button class="menu-btn" id="menuBtn">
    Menu
  </button>
  
  <ul class="nav-links" id="menu">
    <li>
      <a href="index.html">
        Home
      </a>
    </li>
    <li>
      <a href="add_transaction.html">
        Add Transaction
      </a>

    <li>

    <li>

        budget
      </a>
    </li>
  </ul>
  
</nav>

<div class="menu-title">
  Income
</div>
  <div class="content">
    <section class="income-transactions">
      
      <h2 style="margin-bottom:15px;">
        Income Transactions
      </h2>
      <ul id="transactionLists">
        
      </ul>
            
    </section>
    
    <section class="transaction-form">
      <div id="remove">
        ❌
      </div><br>
      <form id="transactionForm">
        
        <h2>
          Add Transactions
        </h2>
        <input type="text" name="name" id="transactionName" placeholder="Transaction Name" required>
        
        <input type="number" name="amount" id="amount" placeholder="Amount" required>
        
        <select name="type" id="type">
          <option value="income" id="incomeTransaction">
            Income
          </option>
          <option value="expenses" id="expensesTransaction">
            Expenses
          </option>
        </select>
        
        <select name="category" id="category">
          <option value="food" id="food">
            Food
          </option>
          <option value="transport" id="transport">
            Transport
          </option>
          <option value="bills" id="bills">
            Bills
          </option>
          <option value="entertainment" id="entertainment">
            Entertainment
          </option>
          <option value="others" id="others">
            Others
          </option>
        </select>
        
        <input type="date" name="datae" id="date" required>
        
        <button type="submit" id="submitBtn">
          Edit Transaction
        </button>
        
      </form>
    </section>
  </div>
  
  <div class="success-msg-container ">
    <div class="success-chk-emoji">
      &#10003
    </div>
    <div class="transaction-msg">
      Transaction edited successfully.
    </div>
  </div>
  
  <div class="error-msg-container ">
    <div class="error-chk-emoji">
      &#10007
    </div>
    <div class="transaction-msg">
      Transaction not edited successfully.
    </div>
  </div>
  
  
  <script src="scripts/transactions.js"></script>
  <script src="scripts/script.js"></script>
  <script src="scripts/income.js"></script>
</body>

</html>
